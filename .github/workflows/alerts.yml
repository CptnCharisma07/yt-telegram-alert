name: YouTube tracker

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay scheduled runs)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write             # saves data to the "data" branch

concurrency:
  group: youtube-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # All bot memory and dashboard data live on a separate "data" branch (one commit, replaced each run),
      # so the main branch only changes when you edit it.
      - name: Get saved data
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-store 2>/dev/null || mkdir -p data-store

      - name: Collect stats and send alerts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: data-store
        run: python collector.py

      - name: Save data
        run: |
          cd data-store
          rm -rf .git && git init -q -b data
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Tracker data"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
