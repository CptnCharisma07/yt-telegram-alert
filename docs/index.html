<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Tube Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark ink sidebar for navigation, sticky filter bar, content in a 12-col flow.
   Home brand (Drishti) = saffron; everyone else = indigo scale. Numbers in mono. */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --surface2: #eef1f6; --fg: #0f1b2d; --muted: #586579; --faint: #8592a6; --line: #e0e5ee;
  --accent: #3446d4; --accent-soft: #e9ecfc; --home: #e46c08; --home-soft: #fff1e3; --home-ink: #a64c00;
  --live: #dc2f3d; --good: #11875a; --bad: #c4362b; --line-strong: #7d8aa0; --on-home: #1a1000;
  --side: #0e1726; --side-fg: #c3cddd; --side-muted: #7f8ca3; --side-on: #ffffff; --side-hi: #1b2740;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --r: 12px; --shadow: 0 1px 2px rgba(15,27,45,.06), 0 4px 14px rgba(15,27,45,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a111d; --surface: #111a2a; --surface2: #172236; --fg: #e6ecf5; --muted: #98a5ba; --faint: #6f7d94; --line: #223049;
  --accent: #8090ff; --accent-soft: #1b2445; --home: #ff9538; --home-soft: #33220f; --home-ink: #ffb46e; --live: #ff5866; --good: #3ccb8a; --bad: #ff7a6e; --line-strong: #5d6d88;
  --side: #070d17; --side-hi: #152035; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a111d; --surface: #111a2a; --surface2: #172236; --fg: #e6ecf5; --muted: #98a5ba; --faint: #6f7d94; --line: #223049;
  --accent: #8090ff; --accent-soft: #1b2445; --home: #ff9538; --home-soft: #33220f; --home-ink: #ffb46e; --live: #ff5866; --good: #3ccb8a; --bad: #ff7a6e; --line-strong: #5d6d88;
  --side: #070d17; --side-hi: #152035; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body) }
a { color: var(--accent) }
[hidden] { display: none !important }
/* accessibility helpers */
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0 }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-weight: 600; text-decoration: none }
.skip:focus { top: max(12px, env(safe-area-inset-top, 0px)) }
.thbtn { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; border-radius: 4px }
.thbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.rowbtn { all: unset; cursor: pointer; border-radius: 4px }
.rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
tbody tr:focus-within td { background: var(--accent-soft) }
/* decluttering: show-more bars, compact pickers, collapsible sections */
.morebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: center; padding-top: 2px }
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.picker select { max-width: 100%; border-style: dashed }
details.fold { min-width: 0 }
details.fold > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 4px 0; border-radius: 6px }
details.fold > summary::-webkit-details-marker { display: none }
details.fold > summary h2::before { content: "\25B8"; display: inline-block; margin-right: 8px; color: var(--muted); transition: transform .15s }
details.fold[open] > summary h2::before { transform: rotate(90deg) }
details.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
details.fold > .fold-body { display: flex; flex-direction: column; gap: 12px; margin-top: 12px }
button { font-family: inherit }
button:focus-visible, select:focus-visible, input:focus-visible, .card:focus-visible, tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* ---- shell ---- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh }
.side { background: var(--side); color: var(--side-fg); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px;
  padding: max(20px, env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px)) }
.logo { display: flex; gap: 10px; align-items: center; padding: 0 6px }
.mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--home), #ff3d5a); display: grid; place-items: center; flex: none }
.mark svg { width: 15px; height: 15px; fill: #fff; margin-left: 2px }
.logo b { display: block; font: 700 1rem/1.15 var(--display); color: var(--side-on); letter-spacing: -.01em }
.logo small { color: var(--side-muted); font-size: .74rem }
nav.tabs { display: flex; flex-direction: column; gap: 2px }
nav.tabs button { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--side-fg); font: 500 .9rem var(--body);
  padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; min-height: 38px; white-space: nowrap }
nav.tabs button svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .85 }
nav.tabs button:hover { background: var(--side-hi); color: var(--side-on) }
nav.tabs button.on { background: var(--side-hi); color: var(--side-on); box-shadow: inset 3px 0 0 var(--home) }
.side .foot { margin-top: auto; font-size: .76rem; color: var(--side-muted); padding: 0 6px; display: flex; flex-direction: column; gap: 6px }
.fresh .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent) }
.fresh.stale .dot { background: var(--bad) }
.home-key { display: flex; align-items: center; gap: 6px } .home-key i { width: 10px; height: 10px; border-radius: 3px; background: var(--home); display: inline-block }

.content { min-width: 0; display: flex; flex-direction: column }
.filters { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  padding: max(12px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 12px 24px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center }
.filters .ttl { margin: 0; font: 700 1.15rem var(--display); margin-right: auto; letter-spacing: -.01em; min-width: 0 }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); overflow-x: auto; max-width: 100%; scrollbar-width: none; padding: 2px; gap: 2px }
.seg button { flex: none; border: 0; background: transparent; color: var(--muted); font: 500 .82rem var(--body); padding: 6px 11px; border-radius: 7px; cursor: pointer; min-height: 32px }
.seg button:hover { color: var(--fg) }
.seg button.on { background: var(--fg); color: var(--bg) }
select, input[type=date], input[type=search] { font: .85rem var(--body); padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--fg); min-height: 36px }
input[type=search] { min-width: 0; flex: 1 1 160px; max-width: 240px }
.custom { display: inline-flex; gap: 6px; align-items: center }
main { padding: 22px 24px 56px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 26px; max-width: 1480px; width: 100% }

@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { position: sticky; top: 0; z-index: 30; height: auto; flex-direction: row; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)) }
  .logo small, .side .foot .home-key { display: none }
  .side .foot { margin: 0 0 0 auto; padding: 0; min-width: 0; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block }
  nav.tabs { flex-direction: row; overflow-x: auto; width: 100%; order: 3; scrollbar-width: none; gap: 4px }
  nav.tabs button { padding: 7px 10px; min-height: 36px }
  nav.tabs button.on { box-shadow: inset 0 -2px 0 var(--home) }
  .filters { top: 0; position: relative; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .filters .ttl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
  main { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)) }
}

/* ---- type & sections ---- */
h2 { font: 700 1.08rem/1.25 var(--display); margin: 0; letter-spacing: -.01em }
.sub { color: var(--muted); font-size: .82rem }
.eyebrow { font: 600 .7rem var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted) }
.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px }
.sec-head .sub { margin-right: auto }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow) }
.notice { background: var(--home-soft); border: 1px solid color-mix(in srgb, var(--home) 40%, transparent); color: var(--fg); border-radius: var(--r); padding: 11px 15px; font-size: .86rem }
.empty { padding: 30px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r) }
.up { color: var(--good) } .down { color: var(--bad) }
.delta { font: 500 .78rem var(--mono); padding: 1px 6px; border-radius: 6px; background: var(--surface2) }
.delta.up { background: color-mix(in srgb, var(--good) 14%, transparent) } .delta.down { background: color-mix(in srgb, var(--bad) 14%, transparent) }

/* ---- hero scorecard ---- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow) }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr) } }
.hero-main { padding: 22px 24px; background: linear-gradient(160deg, var(--home-soft), transparent 70%); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px }
.hero-rank { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap }
.hero-rank .big { font: 800 3.4rem/1 var(--display); color: var(--home-ink); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.hero-rank .of { color: var(--muted); font-size: .92rem; max-width: 22ch }
.hero-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px }
.hs .v { font: 700 1.35rem/1.2 var(--display); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.hs .l { font-size: .76rem; color: var(--muted) }
.sov { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.sovbar { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--surface2) }
.sovbar span { display: block; height: 100%; min-width: 2px; border-right: 2px solid var(--surface) }
.sovleg { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; font-size: .82rem }
.sovleg div { display: flex; align-items: center; gap: 7px; min-width: 0; cursor: pointer; border-radius: 6px; padding: 2px 4px; margin: -2px -4px }
.sovleg div:hover { background: var(--surface2) }
.sovleg i { width: 10px; height: 10px; border-radius: 3px; flex: none }
.sovleg b { font: 500 .8rem var(--mono); margin-left: auto; color: var(--muted) }
.sovleg .me { font-weight: 700; color: var(--home-ink) }

/* ---- KPI tiles ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; box-shadow: var(--shadow) }
.kpi .lbl { font: 600 .7rem var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.kpi .val { font: 700 1.6rem/1.2 var(--display); font-variant-numeric: tabular-nums; margin-top: 6px; letter-spacing: -.01em }
.kpi .note { font-size: .78rem; color: var(--muted); margin-top: 2px }
.kpi.home { border-color: color-mix(in srgb, var(--home) 45%, transparent); background: linear-gradient(180deg, var(--home-soft), var(--surface)) }
.kpi.live .val { color: var(--live) }

/* ---- tables ---- */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow) }
table { border-collapse: collapse; width: 100%; font-size: .85rem }
th, td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums }
td { font-family: var(--mono); font-size: .8rem }
td.l { font-family: var(--body); font-size: .85rem }
tbody tr:last-child td { border-bottom: 0 }
th:first-child, td:first-child { text-align: left }
td.l, th.l { text-align: left }
th { font: 600 .68rem var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); cursor: pointer; user-select: none; background: var(--surface); position: sticky; top: 0; border-bottom-color: var(--line) }
th:hover { color: var(--fg) }
th.sorted { color: var(--fg) } th.sorted::after { content: " ↓"; color: var(--accent) }
tr.home td { background: var(--home-soft) }
tr.home td:first-child { box-shadow: inset 3px 0 0 var(--home) }
tbody tr:hover td { background: var(--accent-soft) }
tr.sel td { background: var(--accent-soft) } tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent) }
tbody tr.click { cursor: pointer }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-left: 8px; opacity: .85 }
tr.home .bar { background: var(--home) }
.rk { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--surface2); font: 600 .72rem var(--mono); margin-right: 8px; color: var(--muted) }
tr.home .rk { background: var(--home); color: var(--on-home) }
.tbl-tools { display: flex; gap: 8px; align-items: center }
.linkbtn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 5px 10px; font-size: .8rem; cursor: pointer; min-height: 32px }
.linkbtn:hover { border-color: var(--accent) }

/* ---- chips ---- */
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: 500 .82rem var(--body); cursor: pointer; min-height: 34px }
.chip:hover { border-color: var(--accent) }
.chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg) }
.chip.homechip { border-color: color-mix(in srgb, var(--home) 55%, transparent) }
.chip.homechip.on { background: var(--home); border-color: var(--home); color: var(--on-home) }
.chip small { opacity: .6; margin-left: 5px; font-family: var(--mono); font-size: .74rem }

/* ---- video cards ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 16px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); transition: transform .15s, border-color .15s }
.card:hover { border-color: var(--accent); transform: translateY(-2px) }
.card.home { border-color: color-mix(in srgb, var(--home) 55%, transparent) }
.card.home .ch b { color: var(--home-ink) }
.thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface2); max-width: 100% }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block }
.thumb::after { content: ""; position: absolute; inset: auto 0 0; height: 40%; background: linear-gradient(transparent, rgba(0,0,0,.45)); pointer-events: none }
.badge { position: absolute; z-index: 1; font: 600 .7rem var(--body); padding: 3px 7px; border-radius: 5px; color: #fff; background: rgba(8,12,20,.78) }
.badge.dur { right: 7px; bottom: 7px; font-family: var(--mono) }
.badge.kind { left: 7px; top: 7px }
.badge.live { background: #c81e2c }
.badge.up { background: #5b45d6 }
.badge.rank { right: 7px; top: 7px; background: var(--fg); color: var(--bg); font-family: var(--mono) }
.card .body { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 }
.card .t { font-weight: 600; font-size: .88rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.card .ch { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.card .ch b { font-weight: 600; color: var(--fg) }
.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font: .76rem var(--mono); color: var(--muted); margin-top: auto }
.stats b { color: var(--fg); font-weight: 500 }
.pill { display: inline-block; font: 600 .7rem var(--body); padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted) }
.pill.hot { background: var(--home-soft); color: var(--home-ink) }
.pill.live { background: var(--live); color: #fff }
.livestrip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory }
.livestrip .card { scroll-snap-align: start }

/* ---- insights ---- */
.heat { display: grid; grid-template-columns: 40px repeat(24, minmax(0, 1fr)); gap: 2px; font: .68rem var(--mono); color: var(--muted); min-width: 560px }
.heat div { aspect-ratio: 1; border-radius: 3px; max-width: 100% }
.heat .lab { aspect-ratio: auto; display: flex; align-items: center }
.kw { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 14px; font-size: .85rem; align-items: center }
.kw .h { font-size: .68rem; text-transform: uppercase; color: var(--muted); letter-spacing: .07em; font-weight: 600 }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) repeat(2, auto); gap: 8px 18px; font-size: .86rem; font-variant-numeric: tabular-nums }
.cmp .h { font-weight: 600; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .07em }
.legend { display: flex; gap: 12px; font-size: .76rem; color: var(--muted); flex-wrap: wrap }
.chartbox { position: relative; height: 210px }

/* ---- detail dialog ---- */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(920px, calc(100vw - 24px)); max-height: calc(100vh - 24px); background: var(--surface); color: var(--fg); box-shadow: 0 24px 80px rgba(0,0,0,.4) }
dialog::backdrop { background: rgba(6,10,18,.62); backdrop-filter: blur(2px) }
.md { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) }
@media (max-width: 760px) { .md { grid-template-columns: minmax(0, 1fr) } }
.md .left img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover }
.md .pad { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.md h3 { font: 700 1.12rem/1.3 var(--display); margin: 0; text-wrap: balance }
.mstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.mstats div { background: var(--surface2); border-radius: 10px; padding: 9px 10px }
.mstats b { display: block; font: 700 1.1rem var(--display); font-variant-numeric: tabular-nums }
.mstats span { font-size: .72rem; color: var(--muted) }
.desc { white-space: pre-wrap; font-size: .8rem; color: var(--muted); max-height: 150px; overflow: auto; overflow-wrap: anywhere; background: var(--surface2); border-radius: 10px; padding: 10px }
.close { position: absolute; right: 12px; top: 12px; z-index: 2; background: rgba(8,12,20,.65); color: #fff; border: 0; border-radius: 50%; width: 34px; height: 34px; font-size: 18px; cursor: pointer }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } .card:hover { transform: none } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="mark"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg></span><div><span style="display:block;font:700 1rem/1.15 var(--display);color:var(--side-on)">Exam Tube Tracker</span><small>UPSC · State PCS on YouTube</small></div></div>
    <nav class="tabs" id="tabs" aria-label="Sections">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
const HOME = "Drishti";
const IST_MS = 5.5 * 3600e3;
const S = { range: "today", from: null, to: null, kind: "all", brand: "", exam: "", q: "", tab: "overview", pickBrand: HOME, pickChan: "", more: {}, pickExam: "UPSC", sort: {} };
let DB = null, HIST = null, DETAILS = null, charts = [], lastUpdated = null;

// ---------- data loading ----------
function dataBase() {
  const p = new URLSearchParams(location.search).get("data");
  if (p) return p.endsWith("/") ? p : p + "/";
  if (location.hostname.endsWith("github.io")) {
    const user = location.hostname.split(".")[0], repo = location.pathname.split("/").filter(Boolean)[0];
    return `https://raw.githubusercontent.com/${user}/${repo}/data/`;
  }
  return "sample-data/";
}
const BASE = dataBase();
async function j(name) { const r = await fetch(BASE + name + "?t=" + Date.now()); if (!r.ok) throw new Error(name + " " + r.status); return r.json(); }

async function load() {
  try {
    const meta = await j("meta.json");                       // tiny file: only download the rest when it changed
    if (DB && meta.updated === lastUpdated) { renderFresh(); return; }
    const [ch, vd, daily] = await Promise.all([j("channels.json"), j("videos.json"), j("daily.json").catch(() => ({ days: {} }))]);
    lastUpdated = meta.updated;
    const chMap = Object.fromEntries(ch.channels.map(c => [c.id, c]));
    const vids = vd.videos.filter(v => chMap[v.c]).map(v => {
      const c = chMap[v.c];
      return { ...v, ch: c, brand: c.brand, exams: c.exams, at: new Date(v.as || v.ss || v.p), pub: new Date(v.p) };
    });
    // channel medians by kind for outlier scores (over all retained items)
    const med = {};
    for (const v of vids) { if (v.v == null || v.ls === "upcoming") continue; (med[v.c + v.k] ||= []).push(v.v); }
    for (const k in med) med[k] = median(med[k]);
    vids.forEach(v => v.mult = v.v != null && med[v.c + v.k] ? v.v / med[v.c + v.k] : null);
    DB = { channels: ch.channels, chMap, vids, meta, brands: [...new Set(ch.channels.map(c => c.brand))],
      exams: [...new Set(ch.channels.flatMap(c => c.exams))], daily: daily.days || {} };
    DB.hasGains = Object.keys(DB.daily).length > 0;
    HIST = null; DETAILS = null;
    fillSelects(); render();
  } catch (e) {
    if (DB) return;                                          // keep showing the last good data
    document.getElementById("main").innerHTML = `<div class="empty">Couldn't load the data (${esc(e.message)}). If you just set this up, wait for the first GitHub run to finish, then refresh.</div>`;
  }
}
async function loadHist() { if (!HIST) { try { HIST = await j("history.json"); } catch { HIST = {}; } } return HIST; }
async function loadDetails() { if (!DETAILS) { try { DETAILS = await j("details.json"); } catch { DETAILS = {}; } } return DETAILS; }

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function median(a) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
const n = x => x == null ? "–" : x >= 1e7 ? (x / 1e7).toFixed(2) + " Cr" : x >= 1e5 ? (x / 1e5).toFixed(1) + " L" : x >= 1e3 ? (x / 1e3).toFixed(1) + "K" : String(Math.round(x));
const pct = x => x == null || !isFinite(x) ? "–" : (x * 100).toFixed(1) + "%";
const dur = s => { if (!s) return ""; const h = s / 3600 | 0, m = (s % 3600) / 60 | 0, ss = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}` : `${m}:${String(ss).padStart(2, "0")}`; };
const istDate = d => new Date(d.getTime() + IST_MS);
const fmtIST = d => d.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
function ago(d) { const m = (Date.now() - d) / 6e4; if (m < 0) return "in " + until(d); if (m < 60) return Math.max(1, m | 0) + "m ago"; if (m < 1440) return (m / 60 | 0) + "h ago"; return (m / 1440 | 0) + "d ago"; }
function until(d) { const m = (d - Date.now()) / 6e4; if (m < 60) return Math.max(1, m | 0) + "m"; if (m < 1440) return (m / 60 | 0) + "h " + (m % 60 | 0) + "m"; return (m / 1440 | 0) + "d"; }
function istMidnight(offsetDays = 0) { const d = istDate(new Date()); d.setUTCHours(0, 0, 0, 0); return new Date(d.getTime() - IST_MS + offsetDays * 864e5); }
function rangeBounds() {
  const now = new Date();
  switch (S.range) {
    case "today": return [istMidnight(0), now, "Today"];
    case "yesterday": return [istMidnight(-1), istMidnight(0), "Yesterday"];
    case "7d": return [istMidnight(-6), now, "Last 7 days"];
    case "30d": return [istMidnight(-29), now, "Last 30 days"];
    case "month": { const d = istDate(now); d.setUTCDate(1); d.setUTCHours(0, 0, 0, 0); return [new Date(d.getTime() - IST_MS), now, "This month"]; }
    case "custom": {
      const f = S.from ? new Date(S.from + "T00:00:00+05:30") : istMidnight(-6), t = S.to ? new Date(new Date(S.to + "T00:00:00+05:30").getTime() + 864e5) : now;
      return [f, t, `${S.from || "…"} to ${S.to || "today"}`];
    }
  }
}
const isLiveNow = v => v.ls === "live";
const isUpcoming = v => v.ls === "upcoming";
function base(opts = {}) {
  const [f, t] = rangeBounds(), q = S.q.trim().toLowerCase();
  return DB.vids.filter(v => {
    if (!opts.anyTime && (v.at < f || v.at >= t)) return false;
    if (!opts.keepUpcoming && isUpcoming(v)) return false;
    if (S.kind !== "all" && v.k !== S.kind) return false;
    if (S.brand && v.brand !== S.brand && !opts.ignoreBrand) return false;
    if (S.exam && !v.exams.includes(S.exam) && !opts.ignoreExam) return false;
    if (q && !v.t.toLowerCase().includes(q)) return false;
    return true;
  });
}
function agg(list) {
  const views = list.reduce((s, v) => s + (v.v || 0), 0), likes = list.reduce((s, v) => s + (v.l || 0), 0), cm = list.reduce((s, v) => s + (v.cm || 0), 0);
  const top = list.reduce((b, v) => !b || (v.v || 0) > (b.v || 0) ? v : b, null);
  const liveSecs = list.filter(v => v.k === "live").reduce((s, v) => s + (v.d || 0), 0);
  const w24 = list.filter(v => v.v24 != null);
  return { avg24: w24.length ? w24.reduce((s, v) => s + v.v24, 0) / w24.length : null, n24: w24.length, n: list.length, nv: list.filter(v => v.k === "video").length, nl: list.filter(v => v.k === "live").length,
    views, likes, cm, avg: list.length ? views / list.length : 0, med: median(list.map(v => v.v || 0)),
    eng: views ? (likes + cm) / views : null, top, liveHrs: liveSecs / 3600 };
}
function groupBy(list, keyFn) { const m = new Map(); for (const v of list) for (const k of [].concat(keyFn(v))) { if (!m.has(k)) m.set(k, []); m.get(k).push(v); } return m; }
function velocity(v) { const h = Math.max(1, (Date.now() - v.at) / 36e5); return (v.v || 0) / h; }
// views gained per channel over the selected IST days (all uploads, not just new ones)
function dayKeys(prev = false) {
  let [f, t] = rangeBounds(); if (prev) { const len = Math.max(864e5, Math.ceil((t - f) / 864e5) * 864e5); t = f; f = new Date(f.getTime() - len); }
  const keys = []; for (let d = f.getTime(); d < t.getTime(); d += 864e5) keys.push(istDate(new Date(d)).toISOString().slice(0, 10)); return keys;
}
function gains(chFilter, prev = false) {
  const m = new Map();
  for (const k of dayKeys(prev)) { const day = DB.daily[k]; if (!day) continue;
    for (const cid in day) { const c = DB.chMap[cid]; if (!c || (chFilter && !chFilter(c))) continue; const [gv, gl] = day[cid];
      m.set(cid, (m.get(cid) || 0) + (S.kind === "video" ? gv : S.kind === "live" ? gl : gv + gl)); } }
  return m;
}
const chOk = c => (!S.brand || c.brand === S.brand) && (!S.exam || c.exams.includes(S.exam));
// per-upload views gained, available for Today and Yesterday (gt/gy/gd come from the collector)
const dayStr = off => istDate(new Date(Date.now() + off * 864e5)).toISOString().slice(0, 10);
function vGain(v) {
  if (v.gd == null) return null;
  const t = dayStr(0), y = dayStr(-1);
  if (S.range === "today") return v.gd === t ? (v.gt || 0) : 0;
  if (S.range === "yesterday") return v.gd === t ? (v.gy || 0) : v.gd === y ? (v.gt || 0) : 0;
  return null;
}
// only trust per-upload gains for days that were tracked from midnight
const hasVGain = () => { const vs = DB.meta.vgains_since, day = dayStr(S.range === "today" ? 0 : -1);
  return (S.range === "today" || S.range === "yesterday") && !!vs && day > vs && DB.vids.some(v => v.gd != null); };
// days before the first complete tracking day are partial
function partialDays(keys) { const gs = DB.meta.gains_since; if (!gs) return []; return keys.filter(k => k <= gs); }
const sumG = (g, pred) => { let s = 0; for (const [cid, x] of g) if (pred(DB.chMap[cid])) s += x; return s; };

// ---------- UI pieces ----------
function card(v, rank) {
  const kind = isLiveNow(v) ? `<span class="badge kind live">● LIVE${v.cv ? " · " + n(v.cv) : ""}</span>` : isUpcoming(v) ? `<span class="badge kind up">⏰ ${esc(fmtIST(v.at))}</span>` : v.k === "live" ? `<span class="badge kind">Live</span>` : "";
  const hot = v.mult && v.mult >= 2 && !isUpcoming(v) ? `<span class="pill hot">${v.mult.toFixed(1)}× usual</span>` : "";
  return `<div class="card${v.brand === HOME ? " home" : ""}" tabindex="0" role="button" aria-label="${esc(v.t)}. ${esc(v.brand)}, ${esc(v.ch.name)}. ${n(v.v)} views${isLiveNow(v) ? ", live now" : isUpcoming(v) ? ", scheduled" : v.k === "live" ? ", live stream" : ""}. Open details" data-vid="${v.id}">
    <div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/${isLiveNow(v) || isUpcoming(v) ? "hqdefault" : "mqdefault"}.jpg" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'}" alt="">${kind}${v.d && !isLiveNow(v) ? `<span class="badge dur">${dur(v.d)}</span>` : ""}${rank ? `<span class="badge rank">#${rank}</span>` : ""}</div>
    <div class="body"><div class="t">${esc(v.t)}</div><div class="ch"><b>${esc(v.brand)}</b> · ${esc(v.ch.name)}</div>
    <div class="stats" aria-hidden="true"><span title="Total views">👁 <b>${n(v.v)}</b></span>${(() => { const g = VG_ON ? vGain(v) : 0; return g ? `<span title="Views gained ${S.range === "today" ? "today" : "yesterday"}" style="color:var(--good)">▲ <b style="color:inherit">${n(g)}</b> ${S.range === "today" ? "today" : "yday"}</span>` : ""; })()}<span title="Likes">👍 <b>${n(v.l)}</b></span><span title="Comments">💬 <b>${n(v.cm)}</b></span><span>${ago(v.at)}</span></div>${hot}</div></div>`;
}
// Card grids start small (2 rows) and grow with "Show more"; ids are stable per tab because render order is fixed
let SEC = 0;
function moreBar(id, shown, total, step) {
  if (total <= step) return "";
  return `<div class="morebar">${shown < total ? `<button type="button" class="linkbtn" data-more="${id}" data-step="${step}">Show ${Math.min(step, total - shown)} more</button>` : ""}<span class="sub">Showing ${shown} of ${total}</span>${shown > step ? `<button type="button" class="linkbtn" data-less="${id}">Show less</button>` : ""}</div>`;
}
function cards(list, limit = 48, ranked = false) {
  if (!list.length) return `<div class="empty">Nothing in this range with these filters.</div>`;
  const id = S.tab + ":c" + (SEC++), step = S.tab === "videos" ? 24 : Math.min(limit, 8), shown = Math.min(list.length, S.more[id] || step);
  return `<div class="cards">${list.slice(0, shown).map((v, i) => card(v, ranked ? i + 1 : 0)).join("")}</div>${moreBar(id, shown, list.length, step)}`;
}

function table(id, cols, rows, opts = {}) {
  const st = S.sort[id] || { k: opts.sortKey || cols.find(c => c.num)?.k, d: opts.dir || -1 };
  rows = [...rows].sort((a, b) => { const x = a[st.k], y = b[st.k]; return (typeof x === "string" ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * st.d; });
  const max = {}; cols.forEach(c => { if (c.bar) max[c.k] = Math.max(1, ...rows.map(r => r[c.k] || 0)); });
  const total = rows.length, lim = opts.limit ?? 12, all = S.more["t:" + id] || total <= lim + 2;
  if (!all) { const top = rows.slice(0, lim), pin = rows.slice(lim).filter(r => r._home || r._sel); rows = top.concat(pin); }
  const bar = total > lim + 2 ? `<div class="morebar"><span class="sub">${all ? `All ${total} rows` : `Top ${lim} of ${total}${rows.length > lim ? " · Drishti pinned" : ""}`}</span><button type="button" class="linkbtn" data-tmore="${id}">${all ? `Show top ${lim}` : `Show all ${total}`}</button></div>` : "";
  return `<div class="tablewrap"><table data-tid="${id}"><thead><tr>${cols.map(c => `<th scope="col" class="${c.num ? "" : "l"} ${st.k === c.k ? "sorted" : ""}" data-k="${c.k}" title="${esc(COLTIP[c.k] || "Sort by this column")}" ${st.k === c.k ? `aria-sort="${st.d < 0 ? "descending" : "ascending"}"` : ""}><button type="button" class="thbtn">${c.h}</button></th>`).join("")}</tr></thead><tbody>${rows.map(r =>
    `<tr class="${r._home ? "home" : ""} ${r._sel ? "sel" : ""} ${r._click ? "click" : ""}" ${r._click ? `data-click="${esc(r._click)}"` : ""}>${cols.map((c, ci) => `<td class="${c.num ? "" : "l"}">${ci === 0 && r._click ? `<button type="button" class="rowbtn" aria-label="Open ${esc(String(r[c.k] ?? ""))}">` : ""}${c.f ? c.f(r[c.k], r) : esc(r[c.k])}${ci === 0 && r._click ? "</button>" : ""}${c.bar ? `<span class="bar" style="width:${Math.round(40 * (r[c.k] || 0) / max[c.k])}px"></span>` : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${bar}`;
}
const COLTIP = {
  gained: "New views picked up during the selected days by every tracked upload (last 60 days), old and new",
  gshare: "Share of all views gained in the selected days",
  views: "Total views so far on uploads posted in the selected days",
  avg: "Average total views per upload posted in the selected days",
  med: "Middle value of total views per upload posted in the selected days",
  avg24: "Average views each upload had 24 hours after going up",
  eng: "(Likes + comments) / views, for uploads posted in the selected days",
  n: "Videos and lives posted in the selected days",
  chv: "Views on every video and Short on the channel during these days, from YouTube's lifetime view count",
  subs: "Subscribers now (YouTube rounds big channels to 3 significant figures)",
  subsD: "Subscriber change over the selected days. Approximate for channels above 1 lakh because YouTube rounds"
};
const brandCols = [
  { k: "name", h: "Brand", f: (x, r) => `${r.rank ? `<span class="rk">${r.rank}</span>` : ""}<b>${esc(x)}</b>${r._home ? ' <span class="pill hot">You</span>' : ""}` },
  { k: "chs", h: "Channels", num: 1 }, { k: "n", h: "Uploads", num: 1 }, { k: "nv", h: "Videos", num: 1 }, { k: "nl", h: "Lives", num: 1 },
  { k: "gained", h: "Views gained", num: 1, f: n, bar: 1 }, { k: "gshare", h: "Share", num: 1, f: pct },
  { k: "avg24", h: "Avg @24h", num: 1, f: n }, { k: "views", h: "Views on uploads", num: 1, f: n }, { k: "avg", h: "Avg views", num: 1, f: n },
  { k: "med", h: "Median", num: 1, f: n }, { k: "likes", h: "Likes", num: 1, f: n }, { k: "cm", h: "Comments", num: 1, f: n }, { k: "eng", h: "Engagement", num: 1, f: pct },
  { k: "chv", h: "All views incl. Shorts", num: 1, f: n }, { k: "subs", h: "Subscribers", num: 1, f: n }, { k: "subsD", h: "Subs change", num: 1, f: x => sgn(x) }
];
// chFilter limits which channels count (e.g. only channels covering one exam)
function brandRows(list, chFilter = chOk) {
  const g = groupBy(list, v => v.brand), G = gains(chFilter), total = [...G.values()].reduce((s, x) => s + x, 0);
  return DB.brands.map(b => { const a = agg(g.get(b) || []), gained = sumG(G, c => c.brand === b);
    const gr = brandGrowth(b, dayKeys(), chFilter);
    return { name: b, chs: DB.channels.filter(c => c.brand === b && chFilter(c)).length, ...a, ...gr, gained, gshare: total ? gained / total : null, _home: b === HOME, _click: "brand:" + b }; });
}
// Compact brand picker: Drishti + most active brands as chips, the rest in a dropdown
function brandPicker(b, counts) {
  const n_ = x => (counts.get(x) || []).length, act = [...DB.brands].sort((x, y) => n_(y) - n_(x));
  const top = [HOME, ...act.filter(x => x !== HOME)].slice(0, 8); if (!top.includes(b)) top.push(b);
  const rest = DB.brands.filter(x => !top.includes(x)).sort((x, y) => x.localeCompare(y));
  return `<div class="picker"><div class="chips">${top.map(x => `<button type="button" class="chip ${x === b ? "on" : ""} ${x === HOME ? "homechip" : ""}" data-brand="${esc(x)}" aria-pressed="${x === b}">${esc(x)}<small>${n_(x)}</small></button>`).join("")}</div>${rest.length ? `<select data-brandsel aria-label="More brands"><option value="">+ ${rest.length} more brands…</option>${rest.map(x => `<option value="${esc(x)}">${esc(x)} (${n_(x)})</option>`).join("")}</select>` : ""}</div>`;
}
const mainKey = () => DB.hasGains ? "gained" : "views";
const gainsNote = () => DB.hasGains ? `Views gained = new views on every upload during these days (counting since ${esc(DB.meta.gains_since || "the tracker started")}). Avg @24h compares uploads at the same age.` : `Views gained starts counting after the first runs; until then brands are ranked by views on uploads from this period.`;

// ---------- tabs ----------

const BLOCKS = [[0, 6, "12–6 AM"], [6, 9, "6–9 AM"], [9, 12, "9 AM–12 PM"], [12, 15, "12–3 PM"], [15, 18, "3–6 PM"], [18, 21, "6–9 PM"], [21, 24, "9 PM–12 AM"]];
function timeStats(list) { return BLOCKS.map(([a, b, l]) => { const xs = list.filter(v => v.v24 != null).filter(v => { const h = istDate(v.at).getUTCHours(); return h >= a && h < b; }).map(v => v.v24); return { label: l, n: xs.length, med: xs.length ? median(xs) : null }; }); }
function bestBlock(stats) { return stats.filter(x => x.n >= 3).sort((x, y) => y.med - x.med)[0] || null; }

// ---------- compare tab ----------
function cmpBrands() {
  if (!S.cmp) { const g = gains(chOk), tot = new Map(); for (const [cid, x] of g) { const b = DB.chMap[cid].brand; tot.set(b, (tot.get(b) || 0) + x); } S.cmp = [HOME, ...[...tot].filter(([b]) => b !== HOME).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0])]; }
  S.cmp = S.cmp.filter(b => DB.brands.includes(b)); return S.cmp;
}
function vCompare() {
  const sel = cmpBrands(), keys = dayKeys(), all = base({ ignoreBrand: true }), G = gains(chOk), totalG = [...G.values()].reduce((a, b) => a + b, 0), label = rangeBounds()[2];
  const data = sel.map(b => { const l = all.filter(v => v.brand === b), a = agg(l), gr = brandGrowth(b, keys), gained = sumG(G, c => c.brand === b);
    return { b, a, gr, gained, share: totalG ? gained / totalG : null, chs: DB.channels.filter(c => c.brand === b && chOk(c)).length, best: bestBlock(timeStats(DB.vids.filter(v => v.brand === b && (S.kind === "all" || v.k === S.kind)))), mix: subjectMix(l), l }; });
  const rowsDef = [
    ["Channels", d => d.chs, x => x, 1], ["Uploads", d => d.a.n, x => x, 1], ["Videos · lives", d => d.a.nv * 1e4 + d.a.nl, (x, d) => `${d.a.nv} · ${d.a.nl}`, 0],
    ["Views gained (long videos & lives)", d => d.gained, n, 1], ["Share of views gained", d => d.share, pct, 1],
    ["All channel views incl. Shorts", d => d.gr.chv, n, 1], ["Avg views at 24h", d => d.a.avg24, n, 1], ["Median views per upload", d => d.a.med, n, 1],
    ["Engagement", d => d.a.eng, pct, 1], ["Live hours", d => d.a.liveHrs, x => x == null ? "–" : x.toFixed(1), 1],
    ["Subscribers (all channels)", d => d.gr.subs, n, 1], ["Subscriber change", d => d.gr.subsD, sgn, 1], ["Best upload time (median @24h)", d => d.best ? d.best.med : null, (x, d) => d.best ? `${d.best.label} · ${n(d.best.med)}` : "–", 0]];
  const head = `<tr><th scope="col" class="l">Measure · ${esc(label)}</th>${data.map(d => `<th scope="col"${d.b === HOME ? ' style="color:var(--home-ink)"' : ""}>${esc(d.b)}</th>`).join("")}</tr>`;
  const body = rowsDef.map(([lbl, get, fmt, hl]) => { const vals = data.map(get), best = hl ? Math.max(...vals.filter(x => x != null)) : null;
    return `<tr><th scope="row" class="l" style="text-transform:none;letter-spacing:0;font:500 .85rem var(--body);color:var(--fg);background:transparent">${lbl}</th>${data.map((d, i) => `<td${hl && vals[i] != null && vals[i] === best && data.length > 1 ? ' style="font-weight:700;color:var(--good)"' : ""}>${fmt(vals[i], d)}</td>`).join("")}</tr>`; }).join("");
  const mixRows = SUBJ_NAMES.map(k => `<tr><th scope="row" class="l" style="text-transform:none;letter-spacing:0;font:500 .85rem var(--body);color:var(--fg);background:transparent">${k}</th>${data.map(d => { const e = d.mix.get(k); return `<td>${d.a.n ? pct(e.n / d.a.n) : "–"}<small class="sub"> · ${e.n}</small></td>`; }).join("")}</tr>`).join("");
  const pickChips = DB.brands.slice().sort((a, b) => (a === HOME ? -1 : b === HOME ? 1 : a.localeCompare(b)));
  return `<section class="sec"><div class="sec-head"><h2>Compare brands side by side</h2><span class="sub">pick up to 4 · best value in each row is green</span></div>
    <div class="picker"><div class="chips">${sel.map(b => `<button type="button" class="chip on ${b === HOME ? "homechip" : ""}" data-cmprm="${esc(b)}" aria-label="Remove ${esc(b)} from comparison">${esc(b)} ✕</button>`).join("")}</div>
    ${sel.length < 4 ? `<select data-cmpadd aria-label="Add a brand to compare"><option value="">+ Add a brand…</option>${pickChips.filter(b => !sel.includes(b)).map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join("")}</select>` : ""}</div></section>
  <section class="sec"><div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="sub">"All channel views incl. Shorts" comes from each channel's lifetime view count, so it covers every video and Short, not just recent uploads. Subscriber counts above 1 lakh are rounded by YouTube, so small changes can show as 0.</div></section>
  <section class="sec"><div class="sec-head"><h2>Share of views gained over time</h2><span class="sub">daily, long videos & lives</span></div>${shareTrend("cmpShare", sel)}</section>
  <section class="sec"><div class="sec-head"><h2>Total channel views per day</h2><span class="sub">includes Shorts and older videos</span></div>${channelViewsTrend("cmpViews", sel)}</section>
  <details class="fold sec" open><summary><h2>Subject mix</h2><span class="sub">share of each brand's uploads by subject · ${esc(label)} · a title can count in more than one subject</span></summary><div class="fold-body">
    <div class="tablewrap"><table><thead>${head.replace("Measure · " + esc(label), "Subject")}</thead><tbody>${mixRows}</tbody></table></div></div></details>`;
}

// ---------- live clash calendar ----------
function clashCalendar() {
  const fx = v => !S.exam || v.exams.includes(S.exam), now = Date.now();
  const ups = DB.vids.filter(v => (isUpcoming(v) || isLiveNow(v)) && fx(v) && v.at >= now - 3 * 36e5 && v.at <= now + 24 * 36e5);
  const slots = new Map();
  for (const v of ups) { const d = istDate(isLiveNow(v) ? new Date(now) : v.at); d.setUTCMinutes(0, 0, 0); const k = d.getTime(); if (!slots.has(k)) slots.set(k, []); slots.get(k).push(v); }
  const rows = [...slots].sort((a, b) => a[0] - b[0]).map(([k, vs]) => { const home = vs.filter(v => v.brand === HOME), oth = vs.filter(v => v.brand !== HOME), by = groupBy(oth, v => v.brand);
    const when = new Date(k - IST_MS);
    return { _t: k, when: when.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", weekday: "short", hour: "numeric" }), home: home.length, homeT: home.map(v => v.ch.name).join(", "),
      others: oth.length, othT: [...by].sort((a, b) => b[1].length - a[1].length).map(([b, l]) => `${b} ${l.length}`).join(" · "), clash: home.length && oth.length ? oth.length : 0, _home: home.length > 0 }; });
  if (!rows.length) return `<div class="empty">No lives scheduled in the next 24 hours.</div>`;
  return table("clash", [{ k: "when", h: "Hour (IST)" }, { k: "home", h: HOME, num: 1, f: (x, r) => x ? `<span title="${esc(r.homeT)}">${x}</span>` : "–" }, { k: "others", h: "Competitors", num: 1 },
    { k: "clash", h: "Clash", num: 1, f: x => x ? `<span class="pill hot">⚠ ${x} competing</span>` : "" }, { k: "othT", h: "Who else is live", f: x => esc(x) }], rows, { sortKey: "_t", dir: 1, limit: 12 });
}

// ---------- detail ----------
async function openVideo(id) {
  const v = DB.vids.find(x => x.id === id); if (!v) return;
  const dlg = document.getElementById("dlg"), body = document.getElementById("dlgBody");
  const eng = v.v ? ((v.l || 0) + (v.cm || 0)) / v.v : null;
  const peers = DB.vids.filter(x => x.c === v.c && x.k === v.k && x.v != null && !isUpcoming(x)), rank = [...peers].sort((a, b) => b.v - a.v).findIndex(x => x.id === id) + 1;
  body.innerHTML = `<div style="position:relative"><button class="close" id="dlgClose" aria-label="Close">×</button>
  <div class="md"><div class="left"><a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt=""></a>
    <div class="pad"><div class="sub">Views over time</div><div class="chartbox"><canvas id="vchart" role="img" aria-label="Views over time for this upload"></canvas></div><div class="sub" id="chartNote"></div></div></div>
  <div class="pad"><h3 id="dlgTitle">${esc(v.t)}</h3>
    <div class="sub">${esc(v.ch.name)} · <b>${esc(v.brand)}</b> · ${esc(v.exams.join(", "))}</div>
    <div>${isLiveNow(v) ? `<span class="pill live">● LIVE · ${n(v.cv)} watching</span>` : isUpcoming(v) ? `<span class="pill">⏰ Starts ${esc(fmtIST(v.at))} IST</span>` : `<span class="pill">${v.k === "live" ? "Live stream" : "Video"}</span>`} ${v.mult ? `<span class="pill ${v.mult >= 2 ? "hot" : ""}">${v.mult.toFixed(1)}× channel usual</span>` : ""} ${rank ? `<span class="pill">#${rank} of ${peers.length} on this channel</span>` : ""}</div>
    <div class="mstats"><div><b>${n(v.v)}</b><span>views</span></div><div><b>${n(v.l)}</b><span>likes</span></div><div><b>${n(v.cm)}</b><span>comments</span></div>
      <div><b>${pct(eng)}</b><span>engagement</span></div><div><b>${v.d ? dur(v.d) : "–"}</b><span>length</span></div><div><b>${n(velocity(v))}</b><span>views / hour</span></div></div>
    <div class="sub">${v.k === "live" ? `Scheduled: ${v.ss ? fmtIST(new Date(v.ss)) : "–"} · Started: ${v.as ? fmtIST(new Date(v.as)) : "–"} · Ended: ${v.ae ? fmtIST(new Date(v.ae)) : "–"}${v.pv ? ` · Peak seen: ${n(v.pv)} watching` : ""}` : `Published ${fmtIST(v.pub)} IST (${ago(v.pub)})`}</div>
    ${v.v24 != null ? `<div class="sub">Views at 24 hours: <b>${n(v.v24)}</b>${v.g6 != null ? ` · gaining ${n(v.g6)} views/hour now` : ""}</div>` : v.g6 != null ? `<div class="sub">Gaining <b>${n(v.g6)}</b> views/hour now</div>` : ""}
    <div id="dlgDetails"></div>
    <div class="sub">Stats updated ${v.u ? ago(new Date(v.u)) : "–"}</div>
    <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener"><b>Watch on YouTube ↗</b></a>
  </div></div></div>`;
  const opener = document.activeElement;
  dlg.showModal();
  dlg.onclose = () => { if (opener && document.body.contains(opener)) opener.focus(); };
  document.getElementById("dlgClose").onclick = () => dlg.close();
  loadDetails().then(D => { const d = D[id], el = document.getElementById("dlgDetails"); if (!d || !el) return;
    el.innerHTML = `${d.tg && d.tg.length ? `<div class="chips">${d.tg.map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div>` : ""}${d.ds ? `<div class="desc" style="margin-top:8px">${esc(d.ds)}</div>` : ""}`; });
  const H = await loadHist(), h = H[id];
  if (h && h.length > 1 && window.Chart) {
    const css = getComputedStyle(document.documentElement);
    if (window.__vchart) window.__vchart.destroy();
    window.__vchart = (new Chart(document.getElementById("vchart"), { type: "line",
      data: { labels: h.map(s => fmtIST(new Date(s[0] * 6e4))), datasets: [{ data: h.map(s => s[1]), borderColor: css.getPropertyValue("--accent").trim(), backgroundColor: "transparent", tension: 0.25, pointRadius: 0, borderWidth: 2 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: css.getPropertyValue("--muted").trim(), maxTicksLimit: 4 }, grid: { display: false } }, y: { ticks: { color: css.getPropertyValue("--muted").trim(), callback: x => n(x) }, grid: { color: css.getPropertyValue("--line").trim() } } } } }));
  } else document.getElementById("chartNote").textContent = "The chart fills in as the tracker records this upload over the next few hours.";
}

// ---------- render & events ----------
function fillSelects() {
  const bs = document.getElementById("brandSel"), es = document.getElementById("examSel");
  bs.innerHTML = `<option value="">All brands</option>` + DB.brands.map(b => `<option ${b === S.brand ? "selected" : ""}>${esc(b)}</option>`).join("");
  es.innerHTML = `<option value="">All exams</option>` + DB.exams.map(e => `<option ${e === S.exam ? "selected" : ""}>${esc(e)}</option>`).join("");
  if (!DB.exams.includes(S.pickExam)) S.pickExam = DB.exams[0];
}
function renderFresh() {
  if (!DB) return;
  const up = new Date(DB.meta.updated), mins = (Date.now() - up) / 6e4, fr = document.getElementById("fresh");
  fr.className = "fresh" + (mins > 40 ? " stale" : "");
  fr.innerHTML = `<span class="dot" aria-hidden="true"></span>${mins > 40 ? "Data delayed · " : ""}Updated ${ago(up)} · ${DB.channels.length} channels · ${DB.vids.length} uploads tracked`;
}
let VG_ON = false;   // per-upload gains usable for the current range (checked once per render)
function render() {
  if (!DB) return;
  renderFresh();
  VG_ON = hasVGain();
  const views = { overview: vOverview, brands: vBrands, compare: vCompare, exams: vExams, videos: vVideos, live: vLive, trending: vTrending, insights: vInsights, channels: vChannels };
  SEC = 0; HOOKS = [];
  charts.forEach(c => c.destroy()); charts = [];
  document.getElementById("main").innerHTML = views[S.tab]();
  HOOKS.forEach(f => f());
  document.getElementById("pageTitle").textContent = document.querySelector(`#tabs [data-t="${S.tab}"]`)?.textContent || "";
  if (S.tab === "brands") drawBrandChart();
}
function seg(id, key, after) { document.getElementById(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S[key] = b.dataset.v; [...e.currentTarget.children].forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); after && after(); render(); }); }
seg("range", "range", () => { document.getElementById("customBox").hidden = S.range !== "custom"; });
seg("kind", "kind");
document.getElementById("from").onchange = e => { S.from = e.target.value; render(); };
document.getElementById("to").onchange = e => { S.to = e.target.value; render(); };
document.getElementById("brandSel").onchange = e => { S.brand = e.target.value; if (S.brand && S.brand !== S.pickBrand) { S.pickBrand = S.brand; S.pickChan = ""; } render(); };
document.getElementById("examSel").onchange = e => { S.exam = e.target.value; render(); };
let qt; document.getElementById("q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; render(); }, 200); };
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.tab = b.dataset.t; [...e.currentTarget.children].forEach(x => x.classList.toggle("on", x === b)); location.hash = S.tab; render(); window.scrollTo(0, 0); });
function goTab(t) { S.tab = t; document.querySelectorAll("#tabs button").forEach(x => { x.classList.toggle("on", x.dataset.t === t); if (x.dataset.t === t) x.setAttribute("aria-current", "page"); else x.removeAttribute("aria-current"); }); location.hash = t; render(); }
document.getElementById("main").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) return openVideo(c.dataset.vid);
  const th = e.target.closest("th[data-k]"); if (th) { const id = th.closest("table").dataset.tid, k = th.dataset.k, cur = S.sort[id]; S.sort[id] = { k, d: cur && cur.k === k ? -cur.d : (th.classList.contains("l") ? 1 : -1) }; return render(); }
  const tr = e.target.closest("tr[data-click]"); if (tr && tr.dataset.click) { const [t, v] = tr.dataset.click.split(/:(.*)/s); if (t === "brand") { S.pickBrand = v; S.pickChan = ""; return goTab("brands"); } if (t === "vid") return openVideo(v);
    if (t === "pchan") { S.pickChan = S.pickChan === v ? "" : v; render(); return document.getElementById("scopeTop")?.scrollIntoView({ behavior: "smooth", block: "start" }); } if (t === "chan") { S.chan = v; if (S.tab !== "channels") goTab("channels"); else render(); setTimeout(() => document.getElementById("chanSec")?.scrollIntoView({ behavior: "smooth" }), 50); return; } }
  if (e.target.closest("#colsBtn")) { S.fullCols = !S.fullCols; return render(); }
  const mb = e.target.closest("[data-more]"); if (mb) { const id = mb.dataset.more; S.more[id] = (S.more[id] || +mb.dataset.step) + (+mb.dataset.step); return render(); }
  const lb = e.target.closest("[data-less]"); if (lb) { delete S.more[lb.dataset.less]; render(); return lb.closest("section, details")?.scrollIntoView({ block: "start" }); }
  const tb = e.target.closest("[data-tmore]"); if (tb) { const k = "t:" + tb.dataset.tmore; S.more[k] = !S.more[k]; return render(); }
  if (e.target.closest("[data-chmore]")) { S.more.pchan = !S.more.pchan; return render(); }
  const cr = e.target.closest("[data-cmprm]"); if (cr) { S.cmp = (S.cmp || []).filter(b => b !== cr.dataset.cmprm); return render(); }
  const bg = e.target.closest("[data-brandgo]"); if (bg) { S.pickBrand = bg.dataset.brandgo; S.pickChan = ""; return goTab("brands"); }
  const pcb = e.target.closest("[data-pchan]"); if (pcb) { S.pickChan = pcb.dataset.pchan; return render(); }
  const bc = e.target.closest("[data-brand]"); if (bc) { S.pickBrand = bc.dataset.brand; S.pickChan = ""; return render(); }
  const ec = e.target.closest("[data-exam]"); if (ec) { S.pickExam = ec.dataset.exam; return render(); }
  const qc = e.target.closest("[data-q]"); if (qc) { S.q = qc.dataset.q; document.getElementById("q").value = S.q; return goTab("videos"); }
  const vs = e.target.closest("#vsort button"); if (vs) { S.vsort = vs.dataset.v; return render(); }
});
document.getElementById("main").addEventListener("change", e => { const ca = e.target.closest("select[data-cmpadd]"); if (ca && ca.value) { S.cmp = [...(S.cmp || []), ca.value].slice(0, 4); return render(); } });
document.getElementById("main").addEventListener("change", e => { const sel = e.target.closest("select[data-brandsel]"); if (sel && sel.value) { S.pickBrand = sel.value; S.pickChan = ""; render(); } });
document.getElementById("main").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) { e.preventDefault(); openVideo(e.target.dataset.vid); } });
document.getElementById("dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== S.tab && document.querySelector(`#tabs [data-t="${h}"]`)) goTab(h); });
const h0 = location.hash.slice(1); if (["overview", "brands", "compare", "exams", "videos", "live", "trending", "insights", "channels"].includes(h0)) goTab(h0);
load();
setInterval(load, 120000);           // check for new data every 2 minutes (redraws only when it changed)
setInterval(renderFresh, 60000);     // keep the "updated x min ago" label current without redrawing
</script>
</body>
